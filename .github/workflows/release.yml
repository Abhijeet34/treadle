# SPDX-License-Identifier: Apache-2.0
# One trigger, and a person's only act is merging the release pull request.
#
# A `push: tags` trigger was removed rather than kept beside this one: a hand-pushed tag would
# fire it, and release-please's own `release_created` output is the only signal that means
# "this tag was created for this tree, just now". Everything downstream keys on that output.
#
# The tag used to be created by a person with `git tag -s`, and that signature was the release
# authorisation. ADR-0037 reverses that decision and says what it cost and what it gives up:
# no release carries a human signature any more. `.github/rulesets/tags.json` still refuses to
# update or delete a `v*` tag, which is the half of the tag policy that stands.
#
# The three-platform matrix sits in front of the tag rather than behind it, and that ordering
# is the whole of what stops another empty release. `v0.1.0` was tagged, `cross-platform`
# failed, `artifacts` skipped, and the tag can never be moved or deleted.
#
# No `concurrency` block. Cancelling a publish mid-flight causes real damage, and GitHub keeps
# only one pending run per group even when nothing is cancelled in flight, so a third push can
# evict the one carrying a release.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Opening and updating the release pull request happens on every push to main,
  # unconditionally: a gate in front of it would stop the pull request from ever appearing,
  # which is a worse failure than any it could prevent. `skip-github-release` is what keeps
  # this half from tagging; `release-tag` below is the other half, behind the matrix.
  release-pr:
    name: release-pr
    # A dispatch names a ref and the workflow that runs is the one on that ref, so this says
    # out loud what `on: push` already restricts. Every job below reaches this guard through
    # `needs:`, which is why it is written once.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # "if set to true, then do not try to tag releases" - the action's own description
          # of this input, at the SHA pinned above.
          skip-github-release: true

  # The release pull request's checks do not start on their own. release-please opens it as
  # `github-actions[bot]`, this repository's `first_time_contributors` approval policy parks
  # every run on that branch, and a parked run attaches no check to the pull request at all,
  # so the required `checks` context can never appear. Forty-six runs concluded
  # `action_required` before anything said so.
  #
  # This job releases them with the run's own token, which is what makes a release unattended
  # without storing a credential to make it so. scripts/approve-release-checks.ts carries the
  # narrowing and test/release/approve-release-checks.test.ts drives it.
  #
  # After release-please, not beside it: measured on run 34288199967, a job that read the pull
  # request one second in answered about the head commit release-please replaced two minutes
  # later.
  release-pr-checks:
    name: release-pr-checks
    needs: release-pr
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      # For POST /actions/runs/{id}/approve alone. Nothing else here needs it, which is why it
      # is not on the job holding contents: write.
      actions: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Approve the release pull request's parked checks
        run: node scripts/approve-release-checks.ts

  # Conditioned on nothing, and that is the point. This matrix used to run on the tag, which
  # put it after the thing it was meant to gate: on `v0.1.0` the tag existed, the three
  # container legs failed for want of TREADLE_ACTOR, `artifacts` skipped, and the tag cannot
  # be moved or deleted.
  #
  # Asking "is this push a release?" before running it is what would put that back. That
  # answer is release-please's to give, and a second opinion saying no when the truth is yes
  # skips the matrix, skips `release-tag` with it, and drops the release in silence. So every
  # push to main pays for macOS and Windows, and main gets three-platform coverage on every
  # commit rather than only on the days a release is cut.
  #
  # The tree it runs on is main's head, which is the tree `release-tag` tags and the tree
  # `artifacts` packs. The preflight there proves that rather than assuming it.
  cross-platform:
    name: cross-platform
    needs: release-pr
    uses: ./.github/workflows/cross-platform.yml

  # The other half of release-please, and the only job in this repository that can create a
  # tag. `skip-github-pull-request` keeps it from opening a second pull request behind
  # `release-pr`'s back. On an ordinary push there is no merged release pull request to
  # release, so it does nothing and says so through `created`.
  release-tag:
    name: release-tag
    needs: [release-pr, cross-platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  artifacts:
    name: artifacts
    needs: release-tag
    if: needs.release-tag.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      # actions/attest-build-provenance signs through GitHub's OIDC identity. No key and no
      # secret: the identity is the workflow, the repository and the commit.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-tag.outputs.tag }}
      RELEASE_SHA: ${{ needs.release-tag.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tagged tree, which is the tree the tarball is packed from.
          ref: ${{ needs.release-tag.outputs.tag }}
          # The preflight resolves the tag object and asks whether the commit is on main. A
          # ref-only fetch brings neither.
          fetch-depth: 0

      # actions/checkout given an explicit `ref` fetches that ref, so `origin/main` need not be
      # in the clone it leaves behind. The preflight's released-branch clause reads it, and a
      # missing ref there would refuse every release rather than the wrong ones. Not shallow:
      # main can be several commits ahead of the tag by the time this runs, and a truncated
      # main has no ancestry for `git merge-base --is-ancestor` to walk.
      - name: Bring the released branch into the clone
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build the bundle
        run: npm run build

      # Refuses a tag that is misnamed, that points anywhere but the commit this run released,
      # that names a version the tree does not declare, or that is off main, and writes the
      # release notes for the version it accepted. scripts/release-preflight.ts carries the
      # clauses and test/release/preflight.test.ts demonstrates each one refusing.
      - name: Release preflight
        run: node scripts/release-preflight.ts --tag "$TAG" --commit "$RELEASE_SHA" --branch origin/main --notes-out "$RUNNER_TEMP/notes.md"

      - name: Pack the tarball
        id: pack
        run: |
          set -euo pipefail
          # --ignore-scripts is redundant under this repository's .npmrc and is written anyway:
          # the one command that turns this tree into bytes other people run should say what it
          # does not execute, rather than depend on a file being read.
          # The filename carries the package name and version; reading it back rather than
          # composing it keeps the product name out of this file.
          filename=$(npm pack --json --ignore-scripts | node -e '
            let s = "";
            process.stdin.on("data", (d) => (s += d)).on("end", () => console.log(JSON.parse(s)[0].filename));
          ')
          echo "tarball=$filename" >> "$GITHUB_OUTPUT"

      # GitHub's dependency-graph export, not `npm sbom`: it describes the manifests from the
      # same data the dependency review reads, needs no dependency installed, and cannot
      # disagree with the alerts on the repository.
      - name: Export the SBOM
        run: gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" > sbom.spdx.json

      # Checksums over both, so someone who has downloaded the assets can check them without
      # a network round trip to the attestation service.
      - name: Checksum the assets
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: sha256sum "$TARBALL" sbom.spdx.json | tee SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      # release-please created the tag and left the release to this job, which is what puts
      # the three assets and the changelog notes on it in one act rather than two.
      - name: Create the release and attach everything
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            "$TARBALL" sbom.spdx.json SHA256SUMS

  # Off until someone deliberately turns it on, and then still not until someone approves the
  # run. Three interlocks were designed, each of which stops publication on its own. The first
  # is open now and the two below it hold:
  #
  #   1. `private: true` in package.json, which npm itself refuses to publish. Removed, so this
  #      one no longer stops anything. The preflight keeps the clause, so a manifest that
  #      carries the field again is refused before a tarball is built.
  #   2. NPM_PUBLISH_ENABLED, a repository variable rather than a secret or a default. Unset,
  #      a release ends at the GitHub release and its three assets. A skipped job is not a
  #      report of that: the run still concludes success, and the release says nothing. The
  #      `publication` job below is the report, and it names this block and the one above it
  #      together, because lifting either one alone publishes nothing.
  #   3. The `npm-publish` environment, which is configured to require a reviewer. The job
  #      stops and waits for a person before it can reach the registry.
  #
  # The unattended release stops here. Nothing above this job asks a person anything any more,
  # and this job still does.
  #
  # It holds no repository write token, and no npm token at all. The OIDC identity that mints
  # the npm credential lives here alone, and everything it publishes was produced, checksummed
  # and attested by the job above.
  publish:
    name: publish
    needs: [release-tag, artifacts]
    if: needs.release-tag.outputs.created == 'true' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-tag.outputs.tag }}
      RELEASE_SHA: ${{ needs.release-tag.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-tag.outputs.tag }}
          fetch-depth: 0

      - name: Bring the released branch into the clone
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # npm's trusted-publishing documentation: "Trusted publishing requires npm CLI version
      # 11.5.1 or later". An older npm fails with ENEEDAUTH, which reads like a misconfigured
      # trusted publisher rather than an old client.
      - name: Check npm can do trusted publishing
        run: |
          set -euo pipefail
          npm --version
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
            if (!ok) throw new Error("npm 11.5.1+ is required for trusted publishing");
          ' "$(npm --version)"

      # The same clauses as the artifacts job, plus the ones that only matter when a tarball
      # is about to leave the machine, among them the `private: true` clause the manifest no
      # longer trips.
      - name: Release preflight
        run: |
          npm ci
          npm run build
          node scripts/release-preflight.ts --tag "$TAG" --commit "$RELEASE_SHA" --branch origin/main --publishing

      # Downloading the release asset rather than rebuilding: what npm receives is then
      # byte-for-byte the artifact that was attested and checksummed above.
      - name: Fetch the attested tarball
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern '*.tgz' --pattern 'SHA256SUMS'
          grep '\.tgz$' SHA256SUMS | sha256sum --check --strict

      # No --provenance flag. npm's documentation: with trusted publishing "npm automatically
      # generates and publishes provenance attestations ... you don't need to add the
      # --provenance flag", and the flag turns a provenance-ineligible publish into a failed
      # release rather than an unattested one.
      - name: Publish
        run: npm publish ./*.tgz --access public

  # The first thing that has ever installed treadle the way a user installs it. It runs in a
  # container rather than on the runner, because the runner has this repository checked out
  # and a `treadle` on PATH from it would answer instead of the published one.
  smoke:
    name: smoke
    needs: [release-tag, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: node:24.15.0-trixie
    env:
      TAG: ${{ needs.release-tag.outputs.tag }}
    steps:
      # The registry serves a new version from a CDN, so the publish returning is not the
      # package being installable yet. Six tries a minute apart rather than one and a guess.
      - name: Install the published package from the registry
        run: |
          set -euo pipefail
          version="${TAG#v}"
          for attempt in 1 2 3 4 5 6; do
            if npm install --global --ignore-scripts "treadle@${version}"; then
              echo "installed treadle@${version} on attempt ${attempt}"
              break
            fi
            if [ "$attempt" = 6 ]; then
              echo "::error::treadle@${version} was published but is not installable" >&2
              exit 1
            fi
            sleep 60
          done

      # The happy path, driven the way the README drives it, against a workspace this job
      # creates in a directory that has never held one.
      - name: Run the happy path
        # The same identity the cross-platform install checks record under, and here for the
        # same reason: `init` and `file` write an event naming who made the change, and C1
        # refuses a record that names nobody. This job never ran to find that out - it sits
        # behind `publish`, which is closed by design - so the fault was latent rather than
        # absent, and it is fixed here alongside the jobs that did fire.
        env:
          TREADLE_ACTOR: github-actions
          TREADLE_ACTOR_KIND: agent
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke && cd /tmp/smoke
          treadle version
          treadle init --yes
          treadle file story "A smoke test filed this"
          treadle backlog
          treadle status
          # The envelope is the contract, so the check is on what it printed, not on exit 0
          # alone: a command that fails prints `err <CODE>` and exits non-zero, and a command
          # that succeeds prints `ok <command>`.
          treadle status | head -1 | grep -q '^ok '
          echo "the published package installs and answers"

  # `publish` above is skipped whenever NPM_PUBLISH_ENABLED is not `true`, `smoke` skips behind
  # it, and the run then concludes success having published nothing. An absent signal reading as
  # a pass is the defect class this repository has been removing, and here it misleads twice
  # rather than once: a reader who set the variable to lift the first block still got nothing,
  # because `private: true` stopped the publish a step later and nothing said so up front.
  #
  # So this job says what happened, on every release, whatever `publish` did. It names every
  # block that applies rather than the one that happened to stop it first, and it writes that
  # onto the release itself, because "did this version reach npm?" is asked at the release and
  # not in a job list where a skipped job looks like a job that had nothing to do.
  #
  # It reports and does not gate: with publication closed by design the condition is true on
  # every release this repository will cut until the name clears, and a red that never clears
  # is a red nobody reads. The run carries a warning annotation and a summary, the release
  # carries the sentence, and neither turns the release red.
  publication:
    name: publication
    needs: [release-tag, artifacts, publish]
    # `always()` because the whole point is to report a `publish` that was skipped, and a
    # skipped dependency skips its dependents by default. Guarded on `artifacts` succeeding
    # because there is no release to write onto when it did not.
    if: always() && needs.release-tag.outputs.created == 'true' && needs.artifacts.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Editing the release the `artifacts` job just created. This job publishes nothing, holds
      # no registry credential, and changes nothing but what the release says about itself.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-tag.outputs.tag }}
      # `skipped`, `success`, `failure` or `cancelled`. This is the only place in the run where
      # that word is turned into a sentence.
      PUBLISH_RESULT: ${{ needs.publish.result }}
      PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
      SUMMARY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # For one field. `private` is read out of the tree the tag names rather than asserted from
      # this file, so the report cannot claim an interlock the released tree does not carry.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-tag.outputs.tag }}

      - name: Say whether this release published, and name every block that stopped it
        run: |
          set -euo pipefail

          # Every block is tested, and none of them short-circuits the next: the defect being
          # fixed is a reader lifting the first one and finding the second waiting behind it.
          blocks="$RUNNER_TEMP/blocks.md"
          : > "$blocks"

          enabled="${PUBLISH_ENABLED:-}"
          if [ "$enabled" != "true" ]; then
            shown="unset"
            [ -z "$enabled" ] || shown="\`$enabled\`"
            printf -- "- The repository variable \`NPM_PUBLISH_ENABLED\` is %s, not \`true\`, so the \`publish\` job's own condition is false and the job never starts.\n" "$shown" >> "$blocks"
          fi

          if [ "$(jq -r '.private == true' package.json)" = "true" ]; then
            printf -- "- \`package.json\` at \`%s\` carries \`\"private\": true\`, which \`scripts/release-preflight.ts --publishing\` refuses and npm refuses after it. Setting the variable above does not lift this one.\n" "$TAG" >> "$blocks"
          fi

          # The third interlock docs/RELEASING.md names is not a file, so it is read rather than
          # claimed. An environment that does not exist is created on first use with no
          # protection rules, so "not readable" and "requires a reviewer" are opposite answers
          # and must not be printed as the same one.
          reviewers=$(gh api "repos/${GITHUB_REPOSITORY}/environments/npm-publish" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' 2>/dev/null) || reviewers=""
          case "$reviewers" in
            '') remaining="The \`npm-publish\` environment could not be read here, so nothing in this run confirms the reviewer interlock \`docs/RELEASING.md\` names. An environment that does not exist yet is created on first use carrying no protection rules, which stops nothing." ;;
            0) remaining="The \`npm-publish\` environment exists and carries no required-reviewer rule, so it would stop nothing once the two blocks above are lifted." ;;
            *) remaining="The \`npm-publish\` environment carries ${reviewers} required-reviewer rule(s), which would hold the job for a person once the blocks above are lifted." ;;
          esac

          section="$RUNNER_TEMP/publication.md"
          {
            echo '## Publication'
            echo
            case "$PUBLISH_RESULT" in
              success)
                echo "\`$TAG\` was published to npm by the \`publish\` job of [this run]($SUMMARY_URL). The \`smoke\` job is what checks that it installs."
                ;;
              skipped)
                echo "**\`$TAG\` was not published to npm.** The assets on this release are the whole of it."
                ;;
              failure | cancelled)
                echo "**\`$TAG\` was not published to npm.** The \`publish\` job of [this run]($SUMMARY_URL) ended \`$PUBLISH_RESULT\`. The assets on this release are the whole of it."
                ;;
              *)
                echo "**Treat \`$TAG\` as unpublished until someone checks the registry.** The \`publish\` job reported \`$PUBLISH_RESULT\`, which this job does not know how to read."
                ;;
            esac
            if [ -s "$blocks" ]; then
              echo
              echo 'Every condition standing in front of publication, rather than the first one to stop it:'
              echo
              cat "$blocks"
            fi
            if [ "$PUBLISH_RESULT" != "success" ]; then
              echo
              echo "$remaining"
            fi
          } > "$section"

          if [ "$PUBLISH_RESULT" = "success" ]; then
            echo "::notice::$TAG was published to npm"
          else
            echo "::warning::$TAG published nothing to npm; $(wc -l < "$blocks" | tr -d ' ') condition(s) stand in front of publication and the release notes name each one"
          fi
          cat "$section" >> "$GITHUB_STEP_SUMMARY"

          # Read, trim, append: a re-run of this job replaces its own paragraph rather than
          # stacking a second one, and the release notes the `artifacts` job wrote survive it.
          # The awk holds blank lines back until a non-blank follows, so the trailing gap before
          # a previous `## Publication` does not grow by one line every time.
          body="$RUNNER_TEMP/body.md"
          gh release view "$TAG" --json body --jq '.body' > "$body"
          awk '
            /^## Publication$/ { exit }
            /^[[:space:]]*$/ { pending = pending $0 "\n"; next }
            { printf "%s", pending; pending = ""; print }
          ' "$body" > "$RUNNER_TEMP/notes.md"
          { cat "$RUNNER_TEMP/notes.md"; echo; cat "$section"; } > "$RUNNER_TEMP/new-body.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/new-body.md"
