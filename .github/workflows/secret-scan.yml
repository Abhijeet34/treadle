# SPDX-License-Identifier: Apache-2.0
# The fleet's secret scan, whose rules live in `automation` and are copied here by its
# `.ci/gitleaks/sync.sh`. Edit `.gitleaks.toml` there and re-sync, never the copy at this
# root: the shared workflow pins the sha256 of both synced files and fails every caller whose
# copy has drifted, which is how one review changes what the whole fleet detects.
#
# This is the BACKSTOP. The gate is `.githooks/pre-push`, which refuses the push before
# anything reaches the remote, and it is inert in a fresh clone until that clone runs
# `git config core.hooksPath .githooks` - repository configuration no commit can carry.
#
# Unlike the private siblings that carry this same file, this repository is public, so
# GitHub's own secret scanning and push protection are on and gitleaks is a second layer
# rather than the only one. What it adds is what GitHub does not look for here:
# `secret_scanning_non_provider_patterns` is off, so GitHub matches partner provider patterns
# alone while `.gitleaks.toml` also catches generic assignments and private-key blocks.
#
# `uses:` names a branch where every other workflow here pins a full commit SHA. GitHub
# exempts this case from `sha_pinning_required` ("Reusable workflows can still be referenced
# by tag"), and a SHA would defeat the point: the canonical rules and the digests they are
# checked against travel inside that workflow, so pinning one commit of it freezes this
# repository's scan at the rules of the day it was pinned. The SHA rule in
# test/architecture/supply-chain.test.ts covers the four workflows that call third-party
# actions; this one calls none.
name: secret scan

on:
  push:
    branches: [main]
  pull_request:
  # What changes between runs is gitleaks' rule set, not this repository's history.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secrets:
    uses: Abhijeet34/automation/.github/workflows/shared-secret-scan.yml@main
