# SPDX-License-Identifier: Apache-2.0
# The fleet's secret scan, INLINED rather than calling automation's shared-secret-scan.yml the
# way every other repository in the fleet does. The difference is visibility, not preference: a
# public repository may not use a reusable workflow that lives in a private one, and automation
# is private. GitHub refuses the call before it creates any job, so the `uses:` form failed here
# with zero jobs and contributed no check at all - a red X that looks nothing like a scan that
# found something (run 34200497703, whose jobs API reports total_count 0). Do not move this back
# onto the shared workflow while treadle is public and automation is not.
#
# What follows reproduces that workflow rather than approximating it: gitleaks pinned by version
# and verified by sha256 after download, the canonical digests pinned so a drifted copy of either
# synced file still fails here, and a history scan that fails closed rather than calling a
# repository clean it never read. AGENTS.md, "Secret scanning", carries how the pins are kept
# current and what does not notice when they go stale.
name: secret scan

on:
  push:
    branches: [main]
  pull_request:
  # What changes between runs is gitleaks' rule set, not this repository's history.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      # sha256 of automation's copies, the canonical ones. This job cannot clone that private
      # repository to diff against them, so the digests travel here instead;
      # `.ci/gitleaks/sync.sh --digest config` and `--digest hook` print the current values.
      CONFIG_SHA256: "e5adcb3ceaf8a1645a5924bda7aebfb49903bb9c4b411a3b8c0690960a1f30dd"
      HOOK_SHA256: "0bc282dcd6fe93ce88ca09fa73cf713bb00be61650c4c1352eef7c41b61fbd92"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A credential that was committed and later deleted is still published, so the tip
          # alone is not enough. Measured on quota-axi: a default fetch saw 75 commits where the
          # full one walked 171, and reported clean on the strength of the 75.
          fetch-depth: 0

      # Downloaded and checksummed rather than run through a third-party action, for the reason
      # ci.yml's actionlint job states: this job's whole subject is that a workflow should not
      # run code nobody pinned.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz

      # Two pins, one step, because they are the same question about the two files
      # .ci/gitleaks/sync.sh distributes: .gitleaks.toml is the RULES this backstop scans by, and
      # .githooks/pre-push is the GATE that refuses a push before anything reaches the remote.
      # Pinning only the config left four repositories 27 lines behind canonical on the hook with
      # every check green, which is why both are asked here.
      - name: Verify this repository carries the canonical gate
        run: |
          set -uo pipefail
          sha256() { sha256sum "$1" | cut -d' ' -f1; }
          rc=0
          pinned() { # path expected-digest
            if [ ! -r "$1" ]; then
              echo "::error::$1 is missing, so this repository is not carrying the canonical gate. Re-run automation's .ci/gitleaks/sync.sh." >&2
              rc=1
              return
            fi
            actual=$(sha256 "$1")
            if [ "$actual" != "$2" ]; then
              echo "::error::$1 has DRIFTED from automation's canonical copy (pinned ${2:-<unset>}, found $actual). Re-run automation's .ci/gitleaks/sync.sh, and if that reports no drift the stale value is the pin in this workflow." >&2
              rc=1
            fi
          }
          pinned .gitleaks.toml "${CONFIG_SHA256:-}"
          pinned .githooks/pre-push "${HOOK_SHA256:-}"

          # Content alone is not the gate. git skips a hook that is not executable and says
          # nothing about it, so a byte-perfect hook committed 100644 never runs, which reads
          # exactly like a hook that found nothing. The mode is tracked, so this can see it; the
          # other inertness - core.hooksPath unset in the clone - is repository config that no
          # checkout carries, and only automation's `sync.sh --check` reaches it.
          if [ -r .githooks/pre-push ] && [ ! -x .githooks/pre-push ]; then
            echo "::error::.githooks/pre-push is not executable, so git will never run it. chmod +x and commit the mode." >&2
            rc=1
          fi
          exit $rc

      # `gitleaks dir` fails closed on its own: it exits 1 with an FTL on a path it cannot walk,
      # and the digest step above has already proved the checkout is populated. The history scan
      # below does not, hence the guard there.
      - name: Scan the working tree
        run: gitleaks dir . --config .gitleaks.toml --no-banner --redact --log-level warn

      - name: Scan the full history
        run: |
          set -uo pipefail

          # Measured on gitleaks 8.30.1: a `gitleaks git` that cannot read the repository logs an
          # ERR, reports "0 commits scanned." and STILL EXITS 0. Trusting that exit code reports
          # a repository clean that was never read - a scan that fails open is worse than no
          # scan. So count what git says exists and refuse unless the scan says it read it. Same
          # rule, same reason, as .githooks/pre-push.
          fail() {
            echo "::error::$1 COULD NOT ESTABLISH that this history is clean." >&2
            exit 1
          }

          # A shallow checkout scans the tip and pronounces the whole repository clean, which is
          # exactly the false verdict `fetch-depth: 0` above is there to prevent. Assert it took
          # effect rather than assume it.
          [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = false ] \
            || fail "the checkout is shallow, so the full history was never fetched."
          expected=$(git rev-list --count --all) || fail "cannot enumerate this repository's commits."

          # --log-level info is load-bearing: the commit count this parses is an INF line, so
          # `warn` would hide the only evidence the scan ran. `rc=$?` on its own line would never
          # run: the runner's shell is `bash -e {0}`, which aborts on the failing ASSIGNMENT, so
          # a genuine leak - gitleaks exit 1 - would take the step down before this body printed
          # the findings or reached the `secrets found` message below. Red for the right reason
          # and with no output at all, which reads exactly like a broken step.
          rc=0
          out=$(gitleaks git . --config .gitleaks.toml \
            --no-banner --no-color --redact --log-level info 2>&1) || rc=$?
          printf '%s\n' "$out"

          printf '%s\n' "$out" | grep -q ' ERR ' \
            && fail "gitleaks reported an error while reading the repository."
          scanned=$(printf '%s\n' "$out" | sed -n 's/.*[^0-9]\([0-9][0-9]*\) commits scanned\..*/\1/p' | tail -1)
          case "${scanned:-}" in
            '') fail "gitleaks did not report how many commits it scanned (unexpected output format)." ;;
          esac
          # Only that it read SOMETHING, never that it read all $expected. Measured on 8.30.1:
          # gitleaks counts commits that contributed added content, so an empty commit and every
          # merge commit are legitimately uncounted - measured here, gitleaks reports three
          # fewer than `git rev-list --count --all`, and that gap grows with the history. A
          # `-ge $expected` comparison would therefore red-light every repository with a merge.
          # Full coverage is established by the shallow check above instead.
          if [ "$expected" -gt 0 ] && [ "$scanned" -eq 0 ]; then
            fail "gitleaks scanned 0 of the $expected commits in this repository."
          fi

          case $rc in
            0) echo "scanned $scanned commits, no leaks found" ;;
            1) echo "::error::secrets found in this repository's history - rotate the credential first, rewriting history does not un-leak it." >&2
               exit 1 ;;
            *) fail "the scan did not complete (gitleaks exit $rc)." ;;
          esac
