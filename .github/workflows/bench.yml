# SPDX-License-Identifier: Apache-2.0
# DR8's regression gate. Linux only, for the reason ci.yml states.
#
# What it enforces is what transfers between machines: the axis outcomes (durability under
# parallel writers, silent drops, whole-store refusals, crashes on malformed input), the
# budgets that are properties of the package rather than of a machine (dependency count,
# install size, bundle size) and the two ratio budgets that price `doctor` and `next` against
# the workspace read in the same job. A failure in any of them is evidence about the change.
#
# It does not run on a pull request. It ran 163 times in four days there, cost 5 min 53 s of a
# six-minute pull-request wall clock, and fired once in all of them, on a crash count. The
# weekly schedule and `workflow_dispatch` still measure every axis at every scale, which is
# where the outcomes were ever read from.

name: Benchmarks

on:
  push:
    branches: [main]
  schedule:
    # Weekly, at every scale. 10k and 50k cost minutes of corpus generation and belong where
    # they are not paid per push.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a superseded run: a scheduled, push or workflow_dispatch run is each the only
# record of its own result, and cancelling one mid-flight discards a week's 10k/50k
# measurement for nothing.
concurrency:
  group: bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Measure and gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # The package rows DR8 budgets (install size, bundle size) are properties of the tarball
      # the `files` allowlist produces, and that ships dist/treadling.js. Without this step every
      # one of them reports NOT MEASURED rather than a number.
      - name: Build the bundle
        run: npm run build

      - name: Measure and gate
        env:
          TREADLING_BENCH_DIR: ${{ runner.temp }}/treadling-bench
          # A push to main measures the two small scales; the weekly and dispatched runs
          # measure all four.
          SCALES: ${{ github.event_name == 'push' && '100,1000' || '100,1000,10000,50000' }}
        run: npm run bench:gate -- --scales "$SCALES" --out bench/results

      - name: Summary
        if: always()
        run: cat bench/results/bench.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bench-${{ github.run_id }}
          path: bench/results/
