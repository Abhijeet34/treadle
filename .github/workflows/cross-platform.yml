# SPDX-License-Identifier: Apache-2.0
# The macOS and Windows coverage ci.yml deliberately does not carry, plus the two userlands no
# checkout ever exercises. AGENTS.md, "CI runner platforms": a pull request runs Linux only,
# because GitHub bills a macOS minute at about 10x a Linux one and a Windows minute at about
# 1.67x against the same allowance.
#
# What only these runners can find, for this product: the store's advisory lock and its atomic
# rename are `node:fs` primitives whose failure modes differ per platform, path handling is a
# store concern on a tool whose whole state is files, and the terminal width and encoding the
# human rendering measures against are not the same three things anywhere.
#
# And what only the `installed` job below can find: every job here runs the suite from a
# checkout, so none of them ever starts the shipped bundle through its own shebang.
#
# No `concurrency` block at all: cancelling a scheduled or release run discards the only
# record of its own result, and AGENTS.md forbids cancel-in-progress on either.

name: Cross-platform

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  # Called by release.yml on the signed tag, so no artifact is attached and nothing is
  # published on evidence from one platform.
  workflow_call:

permissions:
  contents: read

jobs:
  measure:
    name: ${{ matrix.launcher }}
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # env-node: what treadle ships today, the baseline the decision needs first.
        # bin-sh:   the launcher data/treadle-platform-parity-m5/report.md designed.
        # env-sh:   the same launcher through PATH rather than an absolute POSIX path, which
        #           is the one shape that could resolve to a program a Windows shell has.
        launcher: [env-node, bin-sh, env-sh]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: What this runner has
        shell: bash
        run: |
          node --version
          npm --version
          echo "npm prefix -g: $(npm prefix -g)"
          for p in sh bash node; do echo "which $p: $(which $p || echo none)"; done
          ls -l /bin/sh || echo "no /bin/sh visible to Git Bash"

      - run: npm ci
        shell: bash

      - name: Build, then write the candidate first line over the bundle
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          case "${{ matrix.launcher }}" in
            env-node) first='' ;;
            bin-sh)   first='#!/bin/sh' ;;
            env-sh)   first='#!/usr/bin/env sh' ;;
          esac
          if [ -n "$first" ]; then
            {
              printf '%s\n' "$first"
              printf '%s\n' "':' //; exec node --stack-size=2048 \"\$0\" \"\$@\""
              tail -n +2 dist/treadle.js
            } > dist/treadle.next
            mv dist/treadle.next dist/treadle.js
            chmod +x dist/treadle.js
          fi
          echo "--- first two lines of dist/treadle.js ---"
          head -2 dist/treadle.js | od -c | head -8
          echo "--- node --check on the bundle ---"
          node --check dist/treadle.js && echo "valid JS" || echo "NOT valid JS"

      - name: Pack the tarball and install it globally, as a user would
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pack
          npm pack --ignore-scripts --pack-destination pack
          tgz=$(ls pack/treadle-*.tgz)
          # `./` is load-bearing: npm read `pack/treadle-0.1.0.tgz` as the `owner/repo`
          # GitHub shorthand and tried `git ls-remote ssh://git@github.com/pack/...`,
          # exit 128, measured in run 34151979303 on this runner.
          npm install --global --ignore-scripts "./$tgz"
          echo "installed from ./$tgz"

      - name: Quote the bytes npm generated
        shell: bash
        run: |
          set -uo pipefail
          prefix=$(npm prefix -g)
          echo "prefix: $prefix"
          for f in treadle treadle.cmd treadle.ps1; do
            echo "===================== $f ====================="
            if [ -f "$prefix/$f" ]; then cat "$prefix/$f"; else echo "(no such file)"; fi
          done
          echo "===================== installed shebang ====================="
          head -2 "$prefix/node_modules/treadle/dist/treadle.js" || true

      - name: cmd.exe - treadle version
        shell: cmd
        run: |
          call treadle version
          echo VERSION_EXIT=%ERRORLEVEL%
          exit /b 0

      - name: cmd.exe - treadle init then treadle file
        shell: cmd
        run: |
          mkdir "%RUNNER_TEMP%\cmdws"
          cd /d "%RUNNER_TEMP%\cmdws"
          call treadle init --name cmd-smoke
          echo INIT_EXIT=%ERRORLEVEL%
          call treadle file task "The installed binary filed this from cmd"
          echo FILE_EXIT=%ERRORLEVEL%
          call treadle status
          echo STATUS_EXIT=%ERRORLEVEL%
          exit /b 0

      - name: PowerShell 7 (pwsh) - treadle version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          treadle version
          Write-Host "VERSION_EXIT=$LASTEXITCODE"
          exit 0

      - name: PowerShell 7 (pwsh) - treadle init then treadle file
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\pwshws" | Out-Null
          Set-Location "$env:RUNNER_TEMP\pwshws"
          treadle init --name pwsh-smoke
          Write-Host "INIT_EXIT=$LASTEXITCODE"
          treadle file task "The installed binary filed this from PowerShell"
          Write-Host "FILE_EXIT=$LASTEXITCODE"
          treadle status
          Write-Host "STATUS_EXIT=$LASTEXITCODE"
          exit 0

      - name: Windows PowerShell 5.1 - treadle version
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          treadle version
          Write-Host "VERSION_EXIT=$LASTEXITCODE"
          exit 0
