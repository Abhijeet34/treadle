# SPDX-License-Identifier: Apache-2.0
# Actions are pinned to commit SHAs in every workflow, which is only safe because something
# moves the pins. This is that something; the version behind a SHA is named in the pull
# request title, and CI's own actionlint job reads the result.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      # One pull request through one CI run rather than six. These actions are all
      # first-party and move together.
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    ignore:
      # @types/node's major says which Node the code is allowed to call, and
      # test/architecture/supply-chain.test.ts holds it to engines.node's floor. A major here
      # ahead of that floor lets tsc accept an API absent at 24.15, which only fails later and
      # only where a test runs that line. Raising the floor is what releases this.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # esbuild is separated from the rest of the toolchain because it is the one development
      # dependency whose output ships: it produces the bytes in dist/treadle.js, so its
      # integrity is the product's rather than the build's.
      bundler:
        patterns: ["esbuild"]
      toolchain:
        dependency-type: development
        patterns: ["*"]
